sources:
  - name: jaffle_shop
    database: dbt-tutorial
    schema: jaffle_shop # if not specified, it assumes the schema is the same as the "name"
    tables:
      - name: customers
      - name: orders
        config:
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour
          loaded_at_field: _etl_loaded_at
  - name: stripe
    database: dbt-tutorial
    schema: stripe
    tables:
      - name: payment